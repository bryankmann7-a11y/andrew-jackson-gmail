name: Build Jackson Letters APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$MANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preflight Python and JavaScript syntax
        run: |
          python3 -m py_compile tools/build_archive.py tools/enrich_archive.py tools/ocr_audit.py tools/clean_ocr.py tools/test_ocr_review.py
          node --check app/src/main/assets/threading.js
          node --check app/src/main/assets/sms_view.js
          node --check app/src/main/assets/navigation.js
          node tools/test_inline.cjs
      - name: Download and separate Bassett volumes I–VI
        run: |
          python3 tools/build_archive.py
          test -s app/src/main/assets/archive/corpus.json
      - name: Verify correspondence integrity
        run: python3 tools/test_archive.py
      - name: Check cleaned OCR reading copies
        run: python3 tools/test_ocr_clean.py
      - name: Verify editorial OCR review queue and new readable letters
        run: python3 tools/test_ocr_review.py
      - name: Upload OCR review queue
        uses: actions/upload-artifact@v4
        with:
          name: JacksonLetters-OCR-Review
          path: reports/ocr_review.csv
          if-no-files-found: error
          retention-days: 30
      - name: Test archive filters and reading preferences
        run: |
          node --check app/src/main/assets/reader_ui.js
          node tools/test_reader_ui.cjs
      - name: Check standalone HTML archive export
        run: node tools/test_export.cjs
      - name: Verify Gmail conversation threading
        run: |
          node --check app/src/main/assets/threading.js
          node tools/test_threads.cjs
      - name: Test compact historical message view
        run: |
          node --check app/src/main/assets/sms_view.js
          node tools/test_sms.cjs
      - name: Test Android back navigation and reading position
        run: |
          node --check app/src/main/assets/navigation.js
          node tools/test_navigation.cjs
      - name: Preserve debug signing key across future versions
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jacksonletters-debug-signing-v1
      - name: Prepare reusable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JacksonLetters-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # The emulator test can be invoked manually; it depends on hosted system-image provisioning.
      # Releases still require all archive/UI tests and Android compilation.
      - name: Offline Android emulator smoke test
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p reports
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n org.jacksonletters.archive.parallelv3/org.jacksonletters.archive.MainActivity
            sleep 20
            adb shell pidof org.jacksonletters.archive.parallelv3
            adb shell uiautomator dump /sdcard/jackson-smoke.xml
            adb pull /sdcard/jackson-smoke.xml reports/jackson-smoke.xml
            adb shell screencap -p /sdcard/jackson-smoke.png
            adb pull /sdcard/jackson-smoke.png reports/jackson-smoke.png
            grep -Eiq 'All conversations|All correspondence|2,116|2,1[0-9][0-9]|Correspondence with' reports/jackson-smoke.xml
      - name: Upload emulator screenshot
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: JacksonLetters-Android-Smoke
          path: reports/jackson-smoke.*
          if-no-files-found: warn
          retention-days: 30
      - name: Publish Android APK release
        if: startsWith(github.event.head_commit.message, 'Release Jackson Letters v3.3.0')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk JacksonLetters-v3.3.0.apk
          sha256sum JacksonLetters-v3.3.0.apk > JacksonLetters-v3.3.0.sha256
          if gh release view v3.3.0 >/dev/null 2>&1; then
            gh release upload v3.3.0 JacksonLetters-v3.3.0.apk JacksonLetters-v3.3.0.sha256 --clobber
          else
            gh release create v3.3.0 JacksonLetters-v3.3.0.apk JacksonLetters-v3.3.0.sha256 \
              --target "$GITHUB_SHA" \
              --title "Jackson Letters v3.3.0" \
              --notes-file RELEASE_NOTES.md
          fi
