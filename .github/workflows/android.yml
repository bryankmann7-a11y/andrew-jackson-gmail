name: Build Jackson Letters APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$MANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and separate Bassett volumes I–VI
        run: |
          python3 tools/build_archive.py
          test -s app/src/main/assets/archive/corpus.json
      - name: Verify correspondence integrity
        run: python3 tools/test_archive.py
      - name: Check cleaned OCR reading copies
        run: python3 tools/test_ocr_clean.py
      - name: Verify Gmail conversation threading
        run: |
          node --check app/src/main/assets/threading.js
          node tools/test_threads.cjs
      - name: Test compact historical message view
        run: |
          node --check app/src/main/assets/sms_view.js
          node tools/test_sms.cjs
      - name: Test Android back navigation and reading position
        run: |
          node --check app/src/main/assets/navigation.js
          node tools/test_navigation.cjs
      - name: Preserve debug signing key across future versions
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jacksonletters-debug-signing-v1
      - name: Prepare reusable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JacksonLetters-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
